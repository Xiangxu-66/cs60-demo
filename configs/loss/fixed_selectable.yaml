_target_: src.losses.selectable_adaptive_loss.SelectableAdaptiveLoss
_recursive_: false
use_adaptive_loss: false
components:
  l1:
    enabled: true
    _target_: src.losses.l1_loss.L1Loss
    weight: 1.0
  ssim:
    enabled: true
    _target_: src.losses.ssim_loss.SSIMLoss
    weight: 1.0
    window_size: 11
  hist:
    enabled: true
    _target_: src.losses.color_histogram_loss.ColorHistogramLoss
    weight: 1.0
    num_bins: 64
  color_angle:
    enabled: false
    _target_: src.losses.color_angle_loss.ColorAngleLoss
    weight: 1.0
    mode: "cosine"
    min_norm: 1.0e-3
  perceptual:
    enabled: false
    _target_: src.losses.perceptual_loss.PerceptualLoss
    weight: 1.0
    layers:
      - "relu1_2"
      - "relu2_2"
      - "relu3_3"
  lpips:
    enabled: true
    _target_: src.losses.lpips_loss.LPIPSLoss
    weight: 1.0
  nima:
    enabled: true
    _target_: src.losses.nima_loss.NIMALoss
    weight: 1.0
  retinex:
    enabled: true
    _target_: src.losses.retinex_loss.RetinexLoss
    weight: 1.0
loss_weights:
  l1: 1.0
  ssim: 0.1
  hist: 0.01
  color_angle: 0.02
  lpips: 0.05
  nima: 0.02
  retinex: 0.05
  perceptual: 0.01
adaptive:
  warmup_steps: 20
  ema_decay: 0.9
  epsilon: 1.0e-8
  weight_min: 1.0e-3
  weight_max: 10.0
