# Legacy LUT + Shallow CNN decoder baseline
#
# This keeps the original pre-coarse-to-fine spatial branch so we can compare:
# - decoder=cnn_lut_cnn         (current fixed coarse-to-fine version)
# - decoder=cnn_lut_cnn_legacy  (original finest-feature-first version)
_target_: src.models.decoders.cnn_decoder_lut_cnn_legacy.CNNDecoderLUTCNNLegacy

num_upsample_blocks: 4
base_channels: 64
residual_scale: 0.5

num_luts: 5
lut_size: 33
use_1d_lut: true

cnn_feature_channels: [64, 64, 64, 64]
