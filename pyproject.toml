[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rwkv-color-enhance"
version = "0.1.0"
description = "RWKV-based Image Color Aesthetic Enhancement"
requires-python = ">=3.10"
dependencies = [
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "pytorch-lightning>=2.2",
    "timm>=0.9",
    "transformers>=4.56",
    "einops>=0.7",
    "lpips>=0.1.4",
    "scikit-image>=0.22",
    "pillow>=10.0",
    "matplotlib>=3.8",
    "rich>=13.0",
    "fvcore>=0.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "black>=24.0",
    "isort>=5.13",
    "ruff>=0.3",
    "pre-commit>=3.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
